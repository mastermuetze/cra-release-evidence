name: Release evidence

on:
  release:
    types: [published]

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build the release evidence index
        id: evidence
        uses: mastermuetze/cra-release-evidence@7287897b317bbfb214e60e290b37c15ff5fbf633 # source-only prototype commit
        with:
          release-tag: ${{ github.event.release.tag_name }}
          # Pass previous-tag explicitly if release chronology differs from Git ancestry.
          evidence-paths: |
            reports/**/*.sarif
            reports/**/junit*.xml
            reports/**/trivy*.json
            reports/**/snyk*.json
          required-evidence: sbom,test-results,security-scan,change-summary
          include-raw-reports: false
          fail-on-gaps: false

      - name: Retain the versioned evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cra-evidence-${{ github.run_id }}
          path: ${{ steps.evidence.outputs.package-dir }}
          if-no-files-found: error
          retention-days: 90

# Resolve v0.1.0 to the reviewed full commit SHA before production use.
# Workflow Artifacts are transport, not guaranteed long-term retention.
# A release-asset publisher requires a separate, explicit contents: write job.
